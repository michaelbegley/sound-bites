name: Refresh ratings and hours

on:
  schedule:
    - cron: "0 14 1,15 * *"   # 1st and 15th at 14:00 UTC = ~7 AM Seattle. Fortnightly keeps the API calls inside Google's free tier at 368 places.
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data/places.json
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: python scripts/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/places.json
          git diff --cached --quiet && echo "no changes" || git commit -m "Ratings refresh $(date -u +%Y-%m-%d)"
          git push
